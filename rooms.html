<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อมูลห้องประชุม | KMITL Room Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">K</div><div><strong>KMITL</strong><small>ROOM BOOKING</small></div></div>
      <div><div class="nav-label">WORKSPACE</div><nav class="nav">
        <a href="index.html"><span class="ico">▦</span>ระบบจองห้องประชุม</a>
        <a href="my-bookings.html"><span class="ico">▣</span>การจองของฉัน</a>
        <a href="statistics.html"><span class="ico">▤</span>สถิติการจอง</a>
        <a href="rooms.html" class="active"><span class="ico">▧</span>ข้อมูลห้องประชุม</a>
      </nav></div>
      <div class="profile"><div class="avatar" id="avatar">G</div><div><b id="userLabel">ผู้เยี่ยมชม</b><br><small>KMITL Room Booking</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">KMITL / ข้อมูลห้องประชุม</div><div class="top-actions">
        <button id="loginTop" onclick="location.href='login.html'">เข้าสู่ระบบ</button>
        <button id="registerTop" onclick="location.href='register.html'">สมัครสมาชิก</button>
        <button id="logoutTop" style="display:none" onclick="logout()">ออกจากระบบ</button>
      </div></header>
      <div class="content">
        <div class="eyebrow">MEETING SPACES</div>
        <div class="page-title"><div><h1>ข้อมูลห้องประชุม</h1><p class="sub">รายละเอียดและสิ่งอำนวยความสะดวกของแต่ละห้อง</p></div></div>
        <div class="room-grid" id="roomCards"><p class="sub">กำลังโหลดข้อมูลห้อง...</p></div>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    const escapeHtml = value => String(value ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    async function renderRoomsPage() {
      const grid = document.getElementById('roomCards');
      try {
        const response = await fetch('/api/rooms');
        if (!response.ok) throw new Error('โหลดข้อมูลห้องไม่สำเร็จ');
        const rooms = await response.json();
        grid.innerHTML = rooms.map(room => `
          <article class="room-card">
            <img class="room-card-image" src="${escapeHtml(room.image)}" alt="${escapeHtml(room.name)}" loading="lazy" decoding="async">
            <div class="room-card-body">
              <div class="room-card-heading">
                <h3>${escapeHtml(room.name)}</h3>
                <span class="room-capacity">${escapeHtml(room.capacity)} คน</span>
              </div>
              <p class="room-location">📍 ${escapeHtml(room.location)}</p>
              <p class="room-description">${escapeHtml(room.description)}</p>
              <div class="room-equipment">
                <strong>อุปกรณ์</strong>
                <span>${escapeHtml(room.equipment)}</span>
              </div>
              <a class="primary room-card-action" href="index.html?roomId=${encodeURIComponent(room.id)}">ดูตารางเวลาจอง</a>
            </div>
          </article>`).join('');
      } catch {
        grid.innerHTML = '<p class="sub">ไม่สามารถโหลดข้อมูลห้องได้ กรุณาลองใหม่</p>';
      }
    }
    document.addEventListener('DOMContentLoaded', renderRoomsPage);
  </script>
</body>
</html>
